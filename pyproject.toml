[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meet-scribe"
version = "0.3.0"
description = "Local meeting transcriber — no bots, no cloud"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "soundcard>=0.4.2",
    "faster-whisper>=1.0.0",
    "numpy>=1.24.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cudnn-cu12>=9.0",
    "nvidia-cuda-runtime-cu12>=12.0",
    "nvidia-cuda-nvrtc-cu12>=12.0",
]
build = [
    "cx_Freeze>=7.2",
    "hatchling>=1.21",
]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
meet-scribe = "meet_scribe.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["meet_scribe", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
unfixable = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["meet_scribe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "gui: tests that require a Qt display",
    "integration: tests that need real hardware",
]
filterwarnings = ["ignore::DeprecationWarning"]
